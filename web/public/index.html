<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RayClaw</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: system-ui, "Segoe UI", Roboto, "PingFang SC", sans-serif; background: #fafafa; color: #111; }
    .layout { display: flex; flex-direction: column; height: 100%; max-width: 720px; margin: 0 auto; background: #fff; min-height: 100%; }
    .header { flex: 0 0 auto; padding: 12px 16px; border-bottom: 1px solid #eee; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .title { font-size: 1.1rem; font-weight: 600; margin: 0; }
    .model-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #555; }
    .model-input { width: 200px; padding: 6px 8px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; }
    .chat { flex: 1; overflow-y: auto; padding: 16px; }
    .hint { color: #888; font-size: 14px; margin: 0; }
    .row { margin-bottom: 16px; }
    .user-row { display: flex; justify-content: flex-end; }
    .bubble.user-bubble { background: #ececec; padding: 10px 14px; border-radius: 18px; max-width: 85%; line-height: 1.45; font-size: 15px; }
    .assistant-row { display: flex; justify-content: flex-start; }
    .assistant-body { max-width: 100%; line-height: 1.55; font-size: 15px; }
    .assistant-text { white-space: pre-wrap; word-break: break-word; color: #111; }
    .aux-grey-panel { margin-bottom: 10px; padding: 10px 12px; border-radius: 10px; background: #ebebeb; }
    .aux-grey-panel-head { display: flex; align-items: baseline; justify-content: flex-start; gap: 0; width: 100%; padding: 0; margin: 0 0 8px 0; border: none; background: transparent; cursor: pointer; font: inherit; font-size: 13px; color: #666; text-align: left; }
    .aux-grey-chev { font-size: 13px; color: #777; font-weight: 600; }
    .aux-grey-panel-body { position: relative; margin: 0; padding: 0; border-radius: 8px; overflow: hidden; }
    .aux-grey-panel-body.is-collapsed { max-height: calc(1.55em * 4); }
    .aux-grey-panel-body.is-collapsed::after { content: ""; position: absolute; left: 0; right: 0; top: 22%; bottom: 0; background: linear-gradient(to bottom, rgba(235,235,235,0) 0%, rgba(235,235,235,0.35) 28%, rgba(235,235,235,0.75) 55%, #ebebeb 100%); pointer-events: none; }
    .aux-grey-pre { margin: 0; padding: 0; white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, monospace; font-size: 12px; line-height: 1.55; }
    .aux-grey-panel-body.is-collapsed .aux-grey-pre { background: linear-gradient(180deg, #383838 0%, #525252 18%, #787878 36%, #a0a0a0 52%, #c8c8c8 72%, #e4e4e4 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .aux-grey-panel-body.is-open { max-height: none; }
    .aux-grey-panel-body.is-open::after { display: none; }
    .aux-grey-panel-body.is-open .aux-grey-pre { background: none; -webkit-background-clip: unset; background-clip: unset; color: #555; max-height: min(70vh, 480px); overflow: auto; }
    .error-banner { flex: 0 0 auto; padding: 8px 16px; background: #ffe8e8; color: #a00; font-size: 13px; }
    .composer { flex: 0 0 auto; padding: 12px 16px; border-top: 1px solid #eee; display: flex; gap: 10px; align-items: flex-end; }
    .field { flex: 1; resize: vertical; min-height: 44px; padding: 10px 12px; border: 1px solid #ddd; border-radius: 10px; font-family: inherit; font-size: 15px; }
    .send { padding: 10px 18px; border: none; border-radius: 10px; background: #222; color: #fff; font-size: 15px; cursor: pointer; }
    .send:disabled { opacity: 0.45; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="layout">
    <header class="header">
      <h1 class="title">RayClaw</h1>
      <label class="model-row">模型 <input id="model" class="model-input" value="deepseek-chat" /></label>
    </header>
    <main class="chat" id="chat"></main>
    <div id="err" class="error-banner" style="display:none"></div>
    <footer class="composer">
      <textarea id="input" class="field" rows="2" placeholder="输入消息…"></textarea>
      <button type="button" class="send" id="send">发送</button>
    </footer>
  </div>
  <script>
    const DIALOG_KEY = "rayclaw_dialog_id";
    function dialogId() {
      try {
        let id = sessionStorage.getItem(DIALOG_KEY);
        if (!id) { id = crypto.randomUUID(); sessionStorage.setItem(DIALOG_KEY, id); }
        return id;
      } catch { return "web_session"; }
    }

    const chatEl = document.getElementById("chat");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const modelEl = document.getElementById("model");
    const errEl = document.getElementById("err");

    /** @type {{role:'user',content:string} | {role:'assistant', el: HTMLElement}}[]} */
    let turns = [];
    let loading = false;

    function showErr(msg) {
      errEl.textContent = msg;
      errEl.style.display = msg ? "block" : "none";
    }

    function scrollBottom() {
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function appendUserBubble(text) {
      const row = document.createElement("div");
      row.className = "row user-row";
      row.innerHTML = `<div class="bubble user-bubble"></div>`;
      row.querySelector(".user-bubble").textContent = text;
      chatEl.appendChild(row);
      turns.push({ role: "user", content: text });
      scrollBottom();
    }

    function startAssistant() {
      const row = document.createElement("div");
      row.className = "row assistant-row";
      const body = document.createElement("div");
      body.className = "assistant-body";
      row.appendChild(body);
      chatEl.appendChild(row);
      turns.push({ role: "assistant", el: body });
      scrollBottom();
      return body;
    }

    /** 正文按到达顺序追加；若上一轮已是思考/工具，则新开一段正文 */
    function appendDelta(container, buf) {
      const kids = container.children;
      const last = kids[kids.length - 1];
      if (last && last.classList.contains("assistant-text")) {
        last.textContent += buf;
      } else {
        const textEl = document.createElement("div");
        textEl.className = "assistant-text";
        textEl.textContent = buf;
        container.appendChild(textEl);
      }
      scrollBottom();
    }

    function appendGrayCollapsible(container, summaryLabel, bodyText) {
      const panel = document.createElement("div");
      panel.className = "aux-grey-panel";
      const head = document.createElement("button");
      head.type = "button";
      head.className = "aux-grey-panel-head";
      const title = document.createElement("span");
      title.className = "aux-grey-panel-title";
      title.textContent = summaryLabel;
      const chev = document.createElement("span");
      chev.className = "aux-grey-chev";
      chev.textContent = " >";
      head.appendChild(title);
      head.appendChild(chev);
      const bodyWrap = document.createElement("div");
      bodyWrap.className = "aux-grey-panel-body is-collapsed";
      const pre = document.createElement("pre");
      pre.className = "aux-grey-pre";
      pre.textContent = bodyText && bodyText.length ? bodyText : " ";
      bodyWrap.appendChild(pre);
      head.addEventListener("click", () => {
        const opening = bodyWrap.classList.contains("is-collapsed");
        if (opening) {
          bodyWrap.classList.remove("is-collapsed");
          bodyWrap.classList.add("is-open");
          chev.textContent = " ∨";
        } else {
          bodyWrap.classList.add("is-collapsed");
          bodyWrap.classList.remove("is-open");
          chev.textContent = " >";
        }
      });
      panel.appendChild(head);
      panel.appendChild(bodyWrap);
      container.appendChild(panel);
      scrollBottom();
    }

    function appendReasoning(container, text) {
      appendGrayCollapsible(container, "思考过程", text);
    }

    function appendTool(container, name, preview) {
      appendGrayCollapsible(container, "调用了 " + name, preview || "");
    }

    async function* streamChatGen(payload) {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (!res.ok || !res.body) throw new Error("HTTP " + res.status);
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split("\n");
        buf = lines.pop() || "";
        for (const line of lines) {
          if (!line.startsWith("data: ")) continue;
          const raw = line.slice(6).trim();
          if (!raw) continue;
          let ev;
          try { ev = JSON.parse(raw); } catch { continue; }
          yield ev;
        }
      }
      if (buf.startsWith("data: ")) {
        const raw = buf.slice(6).trim();
        if (raw) {
          try { yield JSON.parse(raw); } catch {}
        }
      }
    }

    async function send() {
      const text = inputEl.value.trim();
      if (!text || loading) return;
      chatEl.querySelector(".hint")?.remove();
      showErr("");
      inputEl.value = "";
      loading = true;
      sendBtn.disabled = true;

      const history = turns.map((t) => {
        if (t.role === "user") return { role: "user", content: t.content };
        const el = t.el;
        const parts = [];
        el.querySelectorAll(".assistant-text").forEach((n) => parts.push(n.textContent || ""));
        return { role: "assistant", content: parts.join("\n").trim() || " " };
      });

      appendUserBubble(text);
      const assistantEl = startAssistant();

      try {
        for await (const ev of streamChatGen({
          text,
          messages: history,
          model: modelEl.value.trim() || "deepseek-chat",
          dialog_id: dialogId(),
          user_id: "web_user",
        })) {
          if (ev.type === "delta" && typeof ev.text === "string") {
            appendDelta(assistantEl, ev.text);
          } else if (ev.type === "reasoning" && typeof ev.text === "string") {
            appendReasoning(assistantEl, ev.text);
          } else if (ev.type === "tool" && typeof ev.tool_name === "string") {
            appendTool(assistantEl, ev.tool_name, typeof ev.preview === "string" ? ev.preview : "");
          }
        }
      } catch (e) {
        showErr(String(e && e.message ? e.message : e));
        turns.pop();
        turns.pop();
        chatEl.removeChild(chatEl.lastElementChild);
        chatEl.removeChild(chatEl.lastElementChild);
      } finally {
        loading = false;
        sendBtn.disabled = false;
        scrollBottom();
      }
    }

    sendBtn.addEventListener("click", send);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    if (!turns.length) {
      chatEl.innerHTML = '<p class="hint">输入消息后发送；仅用户消息显示气泡，助手回复为平铺正文。打开方式：<code>http://127.0.0.1:8765/ui/</code></p>';
    }
  </script>
</body>
</html>
